[project]
name = "bbjobs-backend"
version = "0.1.0"
description = "BBJobs Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "pydantic-settings>=2.2.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "structlog>=24.1.0",
    "sentry-sdk[fastapi]>=2.5.0",
    "slowapi>=0.1.9",
    "apscheduler>=3.10.4",
    "boto3>=1.34.110",
    "resend>=0.8.0",
    "jinja2>=3.1.4",
    "mercadopago>=2.2.2",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.9.0",
    "email-validator>=2.0.0",
    "cloudinary>=1.36.0",
    "clerk-backend-api>=6.0.1",
    "svix>=1.96.1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
