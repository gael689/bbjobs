name: Deploy to Vercel (production)

# Vercel's native GitHub integration blocks deploys whose commit author isn't a
# recognized team member on the Hobby plan (the team has one seat, the owner
# account) - every commit here is authored by a different GitHub identity, so
# it gets blocked regardless of who triggers a redeploy. This workflow
# authenticates with a Vercel API token that belongs to the team owner
# instead, which isn't subject to that per-commit-author check.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_F9dgv8FBzY0NLZEvLp3adTAI
      VERCEL_PROJECT_ID: prj_xTPzxxaatcM69Mdzah0iQFXNodI7
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # vercel.com doesn't move www.bbjobs.com.ar / bbjobs.com.ar to the new deployment on its
      # own (auto-assigning custom domains is off, a side effect of disconnecting Vercel's native
      # Git integration to work around the commit-author seat-block above) - without this, every
      # push builds and deploys fine but the live site keeps serving whatever was aliased last.
      - name: Point production domains at the new deployment
        run: |
          vercel alias set ${{ steps.deploy.outputs.url }} www.bbjobs.com.ar --token=${{ secrets.VERCEL_TOKEN }} --scope talency1
          vercel alias set ${{ steps.deploy.outputs.url }} bbjobs.com.ar --token=${{ secrets.VERCEL_TOKEN }} --scope talency1
