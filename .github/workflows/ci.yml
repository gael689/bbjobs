name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `next build` no corre acá: requiere una NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY válida
      # (Clerk valida el formato de la key al montar <ClerkProvider>, no sólo en runtime),
      # y no vale la pena commitear una key de test sólo para que este chequeo pase. El
      # typecheck cubre la mayoría de las regresiones que un build agregaría.
      - run: npx tsc --noEmit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-placeholder-not-used-at-runtime
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: python -c "from app.main import app; print(f'{len(app.routes)} routes loaded OK')"
